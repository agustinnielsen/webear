<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="shortcut icon" href="/GinoLogo.ico.png">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Académico - Gino Social</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ff7d29',
                        primaryDark: '#e66b1d',
                        dark: '#2c3e50',
                    }
                }
            }
        }
    </script>

    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        .view-section { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .navbar.solid-bg { background-color: rgba(255, 125, 41, 0.95); padding-top: 0.5rem; padding-bottom: 0.5rem; box-shadow: 0 4px 10px rgba(0,0,0,0.15); backdrop-filter: blur(5px); }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff7d29; }
    </style>
</head>
<body class="bg-slate-50 text-dark flex flex-col min-h-screen font-sans">

    <!-- Navbar Minimalista -->
    <nav class="navbar solid-bg fixed top-0 left-0 w-full p-4 md:px-8 flex justify-between items-center z-[1000]">
        <a href="/" class="text-white text-2xl font-black drop-shadow-md hover:scale-105 transition-transform flex items-center gap-2">
            <span class="material-symbols-outlined">arrow_back</span> Gino Social
        </a>

        <div class="flex items-center gap-3">
            <div id="userInfo" class="hidden items-center gap-2 bg-white/20 backdrop-blur-md p-1 pr-3 rounded-full text-white transition-all overflow-hidden">
                <div id="userAvatar" class="w-8 h-8 bg-white text-primary flex items-center justify-center font-bold rounded-full shadow-sm shrink-0">U</div>
                <span id="userName" class="text-sm font-semibold max-w-[100px] truncate transition-all">Usuario</span>
                <button id="logoutBtn" title="Cerrar sesión" class="ml-1 text-white/70 hover:text-white border border-white/50 w-6 h-6 flex items-center justify-center rounded-full text-xs hover:bg-white/10 transition-colors">✕</button>
            </div>
        </div>
    </nav>

    <main class="flex-grow pt-16">
        <!-- VISTA DE PERFIL -->
        <div id="perfil-view" class="view-section">
            <div class="bg-primary pt-16 pb-12 px-6 md:px-12 text-white shadow-inner mb-6 relative overflow-hidden">
                <div class="absolute inset-0 opacity-10" style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%23ffffff\' fill-opacity=\'1\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');"></div>
                <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center gap-6 relative z-10">
                    <div id="perfilAvatarLg" class="w-24 h-24 md:w-32 md:h-32 bg-white text-primary rounded-full flex items-center justify-center text-4xl md:text-5xl font-black shadow-lg shrink-0">?</div>
                    <div class="text-center md:text-left">
                        <h1 id="perfilName" class="text-3xl md:text-5xl font-black drop-shadow-sm mb-2">Cargando...</h1>
                        <p class="text-base md:text-lg opacity-90 flex items-center justify-center md:justify-start gap-2"><span class="material-symbols-outlined">school</span> Perfil Académico</p>
                    </div>
                </div>
            </div>

            <div class="max-w-6xl mx-auto px-4 md:px-8 pb-12">
                <!-- Sistema de Pestañas Perfil -->
                <div class="flex gap-2 border-b border-gray-200 mb-6 w-full overflow-x-auto">
                    <button id="tabPerfilTrayectoria" onclick="switchPerfilTab('trayectoria')" class="py-3 px-6 border-b-2 border-primary text-primary font-bold text-sm md:text-base transition-colors flex items-center gap-2 shrink-0">
                        <span class="material-symbols-outlined text-[18px]">timeline</span> Mi Trayectoria
                    </button>
                    <button id="tabPerfilResenas" onclick="switchPerfilTab('resenas')" class="py-3 px-6 border-b-2 border-transparent text-gray-500 font-semibold hover:text-gray-700 text-sm md:text-base transition-colors flex items-center gap-2 shrink-0">
                        <span class="material-symbols-outlined text-[18px]">forum</span> Mis Reseñas
                    </button>
                </div>
                
                <div id="perfilTrayectoriaContainer">
                    <div class="text-center py-20 text-gray-500">
                        <div class="w-10 h-10 border-4 border-gray-200 border-t-primary rounded-full animate-spin inline-block mb-3"></div>
                        <p class="font-bold">Consultando historial...</p>
                    </div>
                </div>
                <div id="perfilResenasContainer" class="hidden space-y-4">
                    <!-- Reseñas inyectadas por JS -->
                </div>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBnpshX3I7ZY3EUoraDZPdb2W6B6HZOYR0",
            authDomain: "social-sociales.firebaseapp.com",
            projectId: "social-sociales",
            storageBucket: "social-sociales.firebasestorage.app",
            messagingSenderId: "18764420760",
            appId: "1:18764420760:web:92e33662d4e0b050cfa2ed"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        const mod = (id) => document.getElementById(id);

        function getUidFromUrl() {
            // Intenta extraer ID de ginosocial.ar/perfil/12345
            const pathParts = window.location.pathname.split('/').filter(Boolean);
            if (pathParts.includes('perfil') && pathParts.length >= 2) {
                return pathParts[pathParts.indexOf('perfil') + 1];
            }
            // Fallback para ginosocial.ar/perfil.html?uid=12345
            return new URLSearchParams(window.location.search).get('uid');
        }

        async function init() {
            let targetUid = getUidFromUrl();
            const cTrayectoria = mod('perfilTrayectoriaContainer');

            auth.onAuthStateChanged(async user => {
                if (user) {
                    mod('userInfo').classList.remove('hidden');
                    mod('userInfo').classList.add('flex');
                    mod('userName').textContent = (user.displayName || user.email).split(' ')[0];
                    mod('userAvatar').textContent = (user.displayName || 'U')[0].toUpperCase();
                } else {
                    mod('userInfo').classList.add('hidden');
                    mod('userInfo').classList.remove('flex');
                }

                // Si no hay UID en la URL, mostramos el perfil del usuario actual (si está logueado)
                if (!targetUid) {
                    if (user) {
                        targetUid = user.uid;
                        // Actualiza la URL para que se vea linda sin recargar la página
                        window.history.replaceState({}, '', `/perfil/${targetUid}`);
                        await cargarPerfilData(targetUid);
                    } else {
                        cTrayectoria.innerHTML = '<div class="text-center py-20 text-gray-500 font-bold">Iniciá sesión para ver tu trayectoria académica.</div>';
                        mod('perfilName').textContent = 'Anónimo';
                    }
                }
            });

            // Si hay un UID en la URL, lo cargamos inmediatamente
            if (targetUid) {
                await cargarPerfilData(targetUid);
            }

            mod('logoutBtn').onclick = () => {
                auth.signOut();
                window.location.href = '/';
            };
        }

        function switchPerfilTab(tab) {
            const tTrayectoria = mod('tabPerfilTrayectoria');
            const tResenas = mod('tabPerfilResenas');
            const cTrayectoria = mod('perfilTrayectoriaContainer');
            const cResenas = mod('perfilResenasContainer');

            if(tab === 'trayectoria') {
                tTrayectoria.className = "py-3 px-6 border-b-2 border-primary text-primary font-bold text-sm md:text-base transition-colors flex items-center gap-2 shrink-0";
                tResenas.className = "py-3 px-6 border-b-2 border-transparent text-gray-500 font-semibold hover:text-gray-700 text-sm md:text-base transition-colors flex items-center gap-2 shrink-0";
                cTrayectoria.classList.remove('hidden');
                cResenas.classList.add('hidden');
            } else {
                tResenas.className = "py-3 px-6 border-b-2 border-primary text-primary font-bold text-sm md:text-base transition-colors flex items-center gap-2 shrink-0";
                tTrayectoria.className = "py-3 px-6 border-b-2 border-transparent text-gray-500 font-semibold hover:text-gray-700 text-sm md:text-base transition-colors flex items-center gap-2 shrink-0";
                cResenas.classList.remove('hidden');
                cTrayectoria.classList.add('hidden');
            }
        }

        // Busca simultáneamente en todas las colecciones para armar las tarjetas rápidamente
        async function obtenerMateriaPorId(id) {
            const colecciones = ['materias', 'especiales', 'teorias', 'horasdeinv', 'idiomas'];
            
            const promesas = colecciones.map(col => 
                db.collection(col).doc(id).get()
                  .then(doc => doc.exists ? { id: doc.id, ...doc.data(), tipo: col } : null)
                  .catch(() => null)
            );
            
            const resultados = await Promise.all(promesas);
            const materia = resultados.find(r => r !== null);
            
            return materia || { id: id, nombre: id, tipo: 'materias' };
        }

        async function cargarPerfilData(uid) {
            const cTrayectoria = mod('perfilTrayectoriaContainer');

            try {
                const userDoc = await db.collection('usuarios').doc(uid).get();
                if (!userDoc.exists) {
                    cTrayectoria.innerHTML = '<div class="text-center py-20 text-gray-500 font-bold">Perfil no encontrado.</div>';
                    mod('perfilName').textContent = 'Desconocido';
                    return;
                }

                const userData = userDoc.data();
                mod('perfilName').textContent = userData.nombre + ' ' + (userData.apellido || '');
                mod('perfilAvatarLg').textContent = (userData.nombre || 'U')[0].toUpperCase();

                // Cargar Trayectoria
                const cursadasIds = userData.materiasCursadas || [];
                const deseadasIds = userData.materiasDeseadas || [];

                const cursadas = await Promise.all(cursadasIds.map(id => obtenerMateriaPorId(id)));
                const deseadas = await Promise.all(deseadasIds.map(id => obtenerMateriaPorId(id)));

                renderizarTrayectoriaUI(cursadas, deseadas);

                // Cargar Reseñas
                const resenasSnap = await db.collection('resenas').where('usuarioId', '==', uid).get();
                renderizarResenasPerfilUI(resenasSnap.docs.map(d => ({id: d.id, ...d.data()})));

            } catch (error) {
                console.error("Error cargando perfil", error);
                cTrayectoria.innerHTML = '<div class="text-center py-20 text-red-500 font-bold">No se pudo cargar el perfil. Revisa tus permisos.</div>';
            }
        }

        function renderizarTrayectoriaUI(cursadas, deseadas) {
            const c = mod('perfilTrayectoriaContainer');
            
            const generadorTarjetas = (lista, esCursada) => {
                if (lista.length === 0) return `<p class="text-gray-500 text-sm italic py-4 bg-gray-50 rounded-xl px-4 text-center border border-gray-100">La lista está vacía.</p>`;
                
                return `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">` + 
                    lista.map(m => `
                    <div class="bg-white border ${esCursada ? 'border-green-100' : 'border-red-100'} p-4 rounded-xl shadow-[0_2px_10px_rgba(0,0,0,0.02)] hover:shadow-md hover:-translate-y-1 transition-all cursor-pointer flex items-center gap-4" onclick="window.location.href='/#/materia/${m.tipo}/${encodeURIComponent(m.id)}'">
                        <div class="w-12 h-12 rounded-full flex items-center justify-center shrink-0 ${esCursada ? 'bg-green-50 text-green-500' : 'bg-red-50 text-red-500'}">
                            <span class="material-symbols-outlined">${esCursada ? 'check' : 'favorite'}</span>
                        </div>
                        <div class="min-w-0 flex-1">
                            <h4 class="font-bold text-dark leading-tight truncate" title="${m.nombre}">${m.nombre}</h4>
                            <span class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">${m.tipo.replace('materias', 'obligatoria').replace('horasdeinv', 'taller/seminario')}</span>
                        </div>
                        <span class="material-symbols-outlined text-gray-300">chevron_right</span>
                    </div>
                    `).join('') + `</div>`;
            };

            c.innerHTML = `
                <div class="mb-10">
                    <h3 class="text-xl md:text-2xl font-black text-dark mb-4 flex items-center gap-2">
                        <span class="material-symbols-outlined text-green-500 text-3xl">task_alt</span> 
                        Materias Cursadas 
                        <span class="bg-green-100 text-green-700 text-sm px-3 py-0.5 rounded-full ml-2 shadow-inner">${cursadas.length}</span>
                    </h3>
                    ${generadorTarjetas(cursadas, true)}
                </div>
                <div>
                    <h3 class="text-xl md:text-2xl font-black text-dark mb-4 flex items-center gap-2">
                        <span class="material-symbols-outlined text-red-500 text-3xl">favorite</span> 
                        Quiero Cursar 
                        <span class="bg-red-100 text-red-700 text-sm px-3 py-0.5 rounded-full ml-2 shadow-inner">${deseadas.length}</span>
                    </h3>
                    ${generadorTarjetas(deseadas, false)}
                </div>
            `;
        }

        function renderizarResenasPerfilUI(resenas) {
            const c = mod('perfilResenasContainer');
            if (resenas.length === 0) {
                c.innerHTML = `<div class="text-center py-12 text-gray-500 bg-gray-50 rounded-xl border border-gray-100"><span class="material-symbols-outlined text-4xl text-gray-300 block mb-2">speaker_notes_off</span> Este estudiante no ha publicado ninguna reseña todavía.</div>`;
                return;
            }

            resenas.sort((a,b) => (b.fecha?.toMillis()||0) - (a.fecha?.toMillis()||0));

            c.innerHTML = resenas.map(r => `
                <div class="bg-white rounded-2xl p-5 md:p-6 shadow-sm border border-gray-100 cursor-pointer hover:border-primary hover:shadow-md transition-all group" onclick="window.location.href='/#/materia/materias/${encodeURIComponent(r.materiaId)}'">
                    <div class="flex flex-col md:flex-row md:justify-between md:items-start mb-3 border-b border-gray-50 pb-3 gap-2">
                        <div>
                            <h3 class="font-black text-lg md:text-xl text-primary leading-tight group-hover:underline flex items-center gap-2">${r.materiaNombre} <span class="material-symbols-outlined text-gray-300 text-sm">open_in_new</span></h3>
                            <div class="text-xs text-gray-500 mt-1 flex flex-wrap gap-2 items-center">
                                <span class="bg-orange-50 text-primary px-2 py-0.5 rounded font-bold">${r.catedra}</span>
                                <span class="font-semibold text-gray-400">${r.fecha?.toDate().toLocaleDateString()||"Reciente"}</span>
                            </div>
                        </div>
                        <div class="text-xl md:text-2xl tracking-widest text-yellow-500 shrink-0">${'★'.repeat(r.calificacionGeneral)}${'☆'.repeat(5-r.calificacionGeneral)}</div>
                    </div>
                    <p class="text-gray-700 text-sm md:text-base line-clamp-4 leading-relaxed">${r.texto}</p>
                    <div class="mt-4 flex gap-4 text-xs font-semibold text-gray-500">
                        <span class="flex items-center gap-1 bg-gray-50 px-2 py-1 rounded-md"><span class="material-symbols-outlined text-[16px] text-green-600">thumb_up</span> ${r.likes_count||0} útiles</span>
                        <span class="flex items-center gap-1 bg-gray-50 px-2 py-1 rounded-md"><span class="material-symbols-outlined text-[16px] text-blue-500">comment</span> ${r.replies_count||0} respuestas</span>
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
