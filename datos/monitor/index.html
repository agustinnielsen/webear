<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Autores</title>
    
    <!-- Librerías cargadas desde CDN para funcionamiento independiente -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ff7d29',
                        primaryDark: '#e66b1d',
                        dark: '#2c3e50',
                        primaryLight: '#fff2eb',
                        primaryMuted: '#ffdfcc'
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Librería para el mapa de red interactivo -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        .vis-network:focus { outline: none; }
        /* Evitar scroll del body cuando el modal está abierto */
        body.modal-open { overflow: hidden; }
        /* Custom scrollbar para la leyenda y paneles */
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        /* Animación suave para el panel de configuración */
        @keyframes slideDownFade {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-down {
            animation: slideDownFade 0.2s ease-out forwards;
        }
        .animate-spin-slow {
            animation: spin 3s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-50 text-dark font-sans min-h-screen">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef, useCallback } = React;

        // Íconos SVG integrados
        const Activity = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>;
        const RefreshCw = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>;
        const AlertCircle = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
        const Users = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>;
        const BookOpen = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>;
        const Network = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="16" y="16" width="6" height="6" rx="1"></rect><rect x="2" y="16" width="6" height="6" rx="1"></rect><rect x="9" y="2" width="6" height="6" rx="1"></rect><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"></path><path d="M12 12V8"></path></svg>;
        const Calendar = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;
        const Filter = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>;
        const BarChart3 = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 3v18h18"></path><path d="M18 17V9"></path><path d="M13 17V5"></path><path d="M8 17v-3"></path></svg>;
        const PieChartIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>;
        const XIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
        const FileText = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>;
        const Layers = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>;
        const Briefcase = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>;
        const Bookmark = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>;
        const Settings = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>;
        const SearchIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>;
        const TrendingUp = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>;

        // Procesador de identidad de autores
        const getAuthorName = (row) => {
            const apellido = (row['Apellido 1'] || '').trim();
            const nombre = (row['Nombre 1'] || '').trim();
            if (!apellido) return null;
            return nombre ? `${apellido}, ${nombre}` : apellido;
        };

        const parseCSV = (csvText) => {
            const lines = csvText.split('\n');
            if (lines.length === 0) return [];
            
            const headers = lines[0].split(',').map(h => h.trim().replace(/\r$/, ''));
            const result = [];
            
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].replace(/\r$/, '');
                if (!line.trim()) continue;
                
                const regex = /(?:\"([^\"]*(?:\"\"[^\"]*)*)\"|([^,]*))(?:,|$)/g;
                let match;
                const values = [];
                
                while ((match = regex.exec(line)) !== null) {
                    if (match.index === regex.lastIndex) regex.lastIndex++;
                    let val = match[1] ? match[1].replace(/\"\"/g, '\"') : match[2];
                    values.push(val ? val.trim() : '');
                }
                
                if (values.length > 0) {
                    let obj = {};
                    headers.forEach((h, index) => {
                        obj[h] = values[index] || '';
                    });
                    result.push(obj);
                }
            }
            return result;
        };

        const AURA_COLORS = [
            { bg: 'rgba(239, 246, 255, 0.45)', border: 'rgba(147, 197, 253, 0.9)' },
            { bg: 'rgba(240, 253, 244, 0.45)', border: 'rgba(134, 239, 172, 0.9)' },
            { bg: 'rgba(255, 241, 242, 0.45)', border: 'rgba(253, 164, 175, 0.9)' },
            { bg: 'rgba(255, 251, 235, 0.45)', border: 'rgba(252, 211, 77, 0.9)' },
            { bg: 'rgba(250, 245, 255, 0.45)', border: 'rgba(216, 180, 254, 0.9)' },
            { bg: 'rgba(248, 250, 252, 0.45)', border: 'rgba(203, 213, 225, 0.9)' }
        ];

        // Definición global de colores actualizada para incorporar la paleta semántica
        const SLICE_COLORS = ['#ff7d29', '#0ea5e9', '#10b981', '#f59e0b', '#f43f5e', '#8b5cf6', '#ec4899', '#14b8a6', '#94a3b8'];

        // Componente Gráfico de Dona para Género
        const SVGGenderDonut = ({ data }) => {
            const total = data['Femenino'] + data['Masculino'] + data['Otro/No especificado'];
            if (total === 0) return <div className="text-sm text-slate-400 h-full flex items-center justify-center">Sin datos de género</div>;

            const chartData = [
                { name: 'Femenino', count: data['Femenino'], color: '#10b981' }, 
                { name: 'Masculino', count: data['Masculino'], color: '#94a3b8' }, 
                { name: 'Otro/No esp.', count: data['Otro/No especificado'], color: '#e2e8f0' } 
            ].filter(d => d.count > 0);

            let currentAngle = 0;

            return (
                <div className="flex flex-col h-full items-center justify-center pt-2">
                    <div className="relative w-full aspect-square max-h-[140px] mx-auto mb-4">
                        <svg viewBox="0 0 100 100" className="w-full h-full transform -rotate-90 drop-shadow-sm">
                            {chartData.map((item, idx) => {
                                const angle = (item.count / total) * 360;
                                if (angle === 360) {
                                    return (
                                        <g key={idx}>
                                            <circle cx="50" cy="50" r="50" fill={item.color} />
                                        </g>
                                    );
                                }
                                const startAngle = currentAngle;
                                const endAngle = currentAngle + angle;
                                currentAngle = endAngle;

                                const x1 = 50 + 50 * Math.cos(Math.PI * startAngle / 180);
                                const y1 = 50 + 50 * Math.sin(Math.PI * startAngle / 180);
                                const x2 = 50 + 50 * Math.cos(Math.PI * endAngle / 180);
                                const y2 = 50 + 50 * Math.sin(Math.PI * endAngle / 180);
                                const largeArcFlag = angle > 180 ? 1 : 0;

                                const pathData = `M 50 50 L ${x1} ${y1} A 50 50 0 ${largeArcFlag} 1 ${x2} ${y2} Z`;

                                return (
                                    <path 
                                        key={idx} 
                                        d={pathData} 
                                        fill={item.color} 
                                        className="transition-opacity hover:opacity-80 stroke-white stroke-[1.5]"
                                    >
                                        <title>{`${item.name}: ${item.count} textos (${Math.round((item.count / total) * 100)}%)`}</title>
                                    </path>
                                );
                            })}
                            {/* Centro de la dona */}
                            <circle cx="50" cy="50" r="28" fill="#ffffff" />
                            {/* Texto interno actualizado al tono dark */}
                            <text x="50" y="47" transform="rotate(90 50 50)" textAnchor="middle" dominantBaseline="middle" fontSize="18" fontWeight="bold" fill="#2c3e50">{total}</text>
                            <text x="50" y="62" transform="rotate(90 50 50)" textAnchor="middle" dominantBaseline="middle" fontSize="9" fontWeight="500" fill="#64748b">Textos</text>
                        </svg>
                    </div>
                    <div className="flex flex-wrap justify-center gap-x-4 gap-y-2 w-full mt-auto">
                        {chartData.map((item, idx) => (
                            <div key={idx} className="flex items-center text-xs">
                                <div className="w-3 h-3 rounded-full mr-1.5 flex-shrink-0" style={{ backgroundColor: item.color }}></div>
                                <span className="text-slate-600 font-medium">{item.name}</span>
                                <span className="text-slate-400 ml-1 font-bold">{Math.round((item.count / total) * 100)}%</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // Componente Gráfico de Torta Personalizado (SVG Nativo) e Interactivo
        const SVGCompositionPie = ({ data, onAuthorClick }) => {
            if (!data || data.length === 0) return <div className="text-sm text-slate-400 h-full flex items-center justify-center">Sin datos vigentes</div>;
            
            // Limitado a los 10 principales para dejar espacio visual
            const topN = data.slice(0, 10);
            const othersCount = data.slice(10).reduce((sum, item) => sum + item.count, 0);
            const chartData = [...topN];
            if (othersCount > 0) {
                chartData.push({ name: 'Otros', count: othersCount });
            }

            const total = chartData.reduce((sum, item) => sum + item.count, 0);
            let currentAngle = 0;

            return (
                <div className="flex flex-col h-full">
                    <div className="relative w-full aspect-square max-h-[200px] mx-auto mb-4">
                        <svg viewBox="0 0 100 100" className="w-full h-full transform -rotate-90 drop-shadow-sm">
                            {chartData.map((item, idx) => {
                                const angle = (item.count / total) * 360;
                                if (angle === 360) {
                                    return (
                                        <circle 
                                            key={idx} 
                                            cx="50" cy="50" r="50" 
                                            fill={SLICE_COLORS[idx % SLICE_COLORS.length]} 
                                            className="hover:opacity-80 transition-opacity cursor-pointer"
                                            onClick={() => item.name !== 'Otros' && onAuthorClick(item.name)}
                                        >
                                            <title>{`${item.name}: ${item.count} citas (${Math.round((item.count / total) * 100)}%)`}</title>
                                        </circle>
                                    );
                                }
                                const startAngle = currentAngle;
                                const endAngle = currentAngle + angle;
                                currentAngle = endAngle;

                                const x1 = 50 + 50 * Math.cos(Math.PI * startAngle / 180);
                                const y1 = 50 + 50 * Math.sin(Math.PI * startAngle / 180);
                                const x2 = 50 + 50 * Math.cos(Math.PI * endAngle / 180);
                                const y2 = 50 + 50 * Math.sin(Math.PI * endAngle / 180);
                                const largeArcFlag = angle > 180 ? 1 : 0;

                                const pathData = `M 50 50 L ${x1} ${y1} A 50 50 0 ${largeArcFlag} 1 ${x2} ${y2} Z`;

                                return (
                                    <path 
                                        key={idx} 
                                        d={pathData} 
                                        fill={SLICE_COLORS[idx % SLICE_COLORS.length]} 
                                        className={`transition-opacity stroke-white stroke-[0.5] ${item.name !== 'Otros' ? 'hover:opacity-80 cursor-pointer' : ''}`}
                                        onClick={() => item.name !== 'Otros' && onAuthorClick(item.name)}
                                    >
                                        <title>{`${item.name}: ${item.count} citas (${Math.round((item.count / total) * 100)}%)`}</title>
                                    </path>
                                );
                            })}
                        </svg>
                    </div>
                    <div className="flex-1 overflow-y-auto pr-2 custom-scrollbar">
                        <div className="space-y-1.5">
                            {chartData.map((item, idx) => (
                                <div 
                                    key={idx} 
                                    className={`flex items-center text-xs p-1 rounded transition-colors ${item.name !== 'Otros' ? 'hover:bg-slate-100 cursor-pointer' : ''}`}
                                    onClick={() => item.name !== 'Otros' && onAuthorClick(item.name)}
                                    title={item.name !== 'Otros' ? "Ver citas originales" : ""}
                                >
                                    <div className="w-3 h-3 rounded-full mr-2 flex-shrink-0" style={{ backgroundColor: SLICE_COLORS[idx % SLICE_COLORS.length] }}></div>
                                    <span className={`font-medium truncate flex-1 pr-2 ${item.name !== 'Otros' ? 'text-slate-700' : 'text-slate-500'}`}>{item.name}</span>
                                    <span className="text-slate-500 font-bold whitespace-nowrap">
                                        {item.count} <span className="font-normal text-slate-400 ml-0.5">({Math.round((item.count / total) * 100)}%)</span>
                                    </span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // Componente Gráfico Lineal para Evolución de Autores
        const SVGAuthorEvolutionLineChart = ({ selectedAuthors, evolution, yearlyDataMap }) => {
            if (!selectedAuthors || selectedAuthors.length === 0) {
                return (
                    <div className="w-full py-12 flex flex-col items-center justify-center text-slate-400">
                        <SearchIcon className="h-8 w-8 mb-3 opacity-40" />
                        <span className="text-sm font-medium">Busca y selecciona un autor para ver su evolución.</span>
                    </div>
                );
            }
            if (!evolution || evolution.length === 0) {
                return <div className="w-full py-12 flex items-center justify-center text-slate-400 text-sm">No hay datos temporales disponibles.</div>;
            }

            const years = evolution.map(e => e.year);
            let maxY = 1;
            
            selectedAuthors.forEach(author => {
                years.forEach(year => {
                    const count = yearlyDataMap[year]?.[author] || 0;
                    if (count > maxY) maxY = count;
                });
            });

            // Añadir padding visual al techo del gráfico
            maxY = Math.ceil(maxY * 1.15);
            if (maxY < 5) maxY = 5; 

            // Función segura para calcular la posición X centralizada
            const getX = (index) => {
                if (years.length === 1) return 410; // Centro aproximado de 40 a 780
                return 40 + (740 / (years.length - 1)) * index;
            };

            return (
                <div className="w-full h-64 sm:h-80 relative group">
                    <svg viewBox="0 0 800 300" className="w-full h-full overflow-visible" preserveAspectRatio="none">
                        {/* Grid horizontal */}
                        {[0, 0.25, 0.5, 0.75, 1].map(ratio => {
                            const y = 260 - (240 * ratio); // 260 es el piso, 20 es el techo (240 altura total)
                            const val = Math.round(maxY * ratio);
                            return (
                                <g key={`grid-${ratio}`}>
                                    <line x1="40" y1={y} x2="780" y2={y} stroke="#f1f5f9" strokeDasharray={ratio === 0 ? "" : "4 4"} />
                                    <text x="30" y={y} fill="#94a3b8" fontSize="10" fontWeight="500" textAnchor="end" dominantBaseline="middle">{val}</text>
                                </g>
                            );
                        })}

                        {/* Etiquetas del eje X (Años) */}
                        {years.map((year, i) => {
                            const x = getX(i);
                            return (
                                <text key={`lbl-${year}`} x={x} y="285" fill="#64748b" fontSize="11" fontWeight="bold" textAnchor="middle">{year}</text>
                            );
                        })}

                        {/* Dibujo de líneas y puntos por cada autor */}
                        {selectedAuthors.map((author, aIdx) => {
                            const color = SLICE_COLORS[aIdx % SLICE_COLORS.length];
                            
                            const points = years.map((year, i) => {
                                const count = yearlyDataMap[year]?.[author] || 0;
                                const x = getX(i);
                                const y = 260 - ((count / maxY) * 240);
                                return { x, y, count, year };
                            });

                            const pathD = `M ${points.map(p => `${p.x},${p.y}`).join(' L ')}`;

                            return (
                                <g key={`line-${author}`}>
                                    <path 
                                        d={pathD} 
                                        fill="none" 
                                        stroke={color} 
                                        strokeWidth="3" 
                                        strokeLinecap="round" 
                                        strokeLinejoin="round" 
                                        className="transition-all duration-300 drop-shadow-sm" 
                                    />
                                    {points.map((p, i) => (
                                        <g key={`point-${i}`}>
                                            {/* Círculo invisible más grande para atrapar mejor el hover */}
                                            <circle cx={p.x} cy={p.y} r="15" fill="transparent" />
                                            {/* Círculo visible */}
                                            <circle 
                                                cx={p.x} cy={p.y} r="5" 
                                                fill="#ffffff" stroke={color} strokeWidth="2.5" 
                                                className="transition-all duration-200 cursor-pointer"
                                                onMouseEnter={(e) => {
                                                    e.target.setAttribute('r', '7');
                                                    e.target.setAttribute('fill', color);
                                                }}
                                                onMouseLeave={(e) => {
                                                    e.target.setAttribute('r', '5');
                                                    e.target.setAttribute('fill', '#ffffff');
                                                }}
                                            >
                                                <title>{`${author} \nAño: ${p.year}\nCitas vigentes: ${p.count}`}</title>
                                            </circle>
                                        </g>
                                    ))}
                                </g>
                            );
                        })}
                    </svg>
                </div>
            );
        };

        const ConnectionMap = ({ data, onAuthorClick }) => {
            const containerRef = useRef(null);
            const networkRef = useRef(null);

            useEffect(() => {
                if (!containerRef.current || data.length === 0) {
                    if (networkRef.current) {
                        networkRef.current.destroy();
                        networkRef.current = null;
                    }
                    return;
                }

                const nodes = new vis.DataSet();
                const edges = new vis.DataSet();

                const materias = new Set();
                const catedraNodes = new Map(); 
                const authorCatedras = new Map(); 
                const materiaGroups = new Map(); 

                data.forEach(row => {
                    const m = row['Materia'] || 'Sin Materia';
                    const c = row['Catedra'] || 'Sin Cátedra';
                    const a = getAuthorName(row);
                    const mcKey = `${m}::${c}`; 

                    if (m) {
                        materias.add(m);
                        if (!materiaGroups.has(m)) materiaGroups.set(m, new Set());
                    }
                    if (c) {
                        catedraNodes.set(mcKey, { m, c });
                    }
                    if (a) {
                        if (!authorCatedras.has(a)) authorCatedras.set(a, new Set());
                        authorCatedras.get(a).add(mcKey);
                    }
                });

                materias.forEach(m => {
                    const mId = `m_${m}`;
                    nodes.add({ 
                        id: mId, 
                        label: m.toUpperCase(), 
                        group: 'materia', 
                        shape: 'box', 
                        font: { size: 20, bold: true, color: '#2c3e50' },
                        color: { background: 'rgba(255,255,255,0.95)', border: '#94a3b8' },
                        shadow: true,
                        mass: 3, 
                        margin: 15
                    });
                    materiaGroups.get(m).add(mId);
                });

                catedraNodes.forEach(({ m, c }, mcKey) => {
                    const cId = `c_${mcKey}`;
                    nodes.add({ 
                        id: cId, 
                        label: `Cátedra:\n${c}`, 
                        group: 'catedra', 
                        shape: 'box',
                        font: { size: 14, color: '#e66b1d' }, // primaryDark
                        color: { background: 'rgba(255,125,41,0.08)', border: '#ff7d29' }, // primary
                        mass: 1.5,
                        margin: 10
                    });
                    
                    if (materiaGroups.has(m)) {
                        materiaGroups.get(m).add(cId);
                    }

                    edges.add({ 
                        from: `m_${m}`, 
                        to: cId, 
                        dashes: true, 
                        color: { color: '#94a3b8' }, 
                        width: 2,
                        length: 50 
                    });
                });

                authorCatedras.forEach((mcKeys, a) => {
                    if (mcKeys.size > 1) { 
                        const aId = `a_${a}`;
                        nodes.add({ 
                            id: aId, 
                            label: a, 
                            group: 'autor', 
                            shape: 'dot', 
                            size: 16,
                            font: { size: 13, bold: true, color: '#064e3b', background: 'rgba(255,255,255,0.85)' },
                            color: { background: '#10b981', border: '#047857' },
                            mass: 1 
                        });
                        
                        mcKeys.forEach(mcKey => {
                            edges.add({ 
                                from: `c_${mcKey}`, 
                                to: aId, 
                                color: { color: '#10b981', opacity: 0.7 }, 
                                width: 2,
                                length: 200 
                            });
                        });
                    }
                });

                const options = {
                    interaction: { hover: true, tooltipDelay: 200 },
                    physics: {
                        stabilization: { 
                            enabled: true,
                            iterations: 500, 
                            fit: true
                        },
                        barnesHut: { 
                            gravitationalConstant: -3000, 
                            centralGravity: 0.1, 
                            springLength: 120, 
                            springConstant: 0.04, 
                            damping: 0.4 
                        }
                    }
                };

                networkRef.current = new vis.Network(containerRef.current, { nodes, edges }, options);

                networkRef.current.on('beforeDrawing', function (ctx) {
                    let index = 0;
                    materiaGroups.forEach((nodeIds) => {
                        if (!nodeIds || nodeIds.size === 0) return;
                        
                        const positions = networkRef.current.getPositions(Array.from(nodeIds));
                        
                        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                        let hasPoints = false;

                        for (let id in positions) {
                            const pos = positions[id];
                            if (pos) {
                                minX = Math.min(minX, pos.x);
                                minY = Math.min(minY, pos.y);
                                maxX = Math.max(maxX, pos.x);
                                maxY = Math.max(maxY, pos.y);
                                hasPoints = true;
                            }
                        }

                        if (hasPoints) {
                            const colorSet = AURA_COLORS[index % AURA_COLORS.length];
                            const padding = 65; 
                            
                            const width = maxX - minX + padding * 2;
                            const height = maxY - minY + padding * 2;
                            const radius = 15; 
                            const x = minX - padding;
                            const y = minY - padding;

                            ctx.fillStyle = colorSet.bg;
                            ctx.strokeStyle = colorSet.border;
                            ctx.lineWidth = 3;
                            ctx.setLineDash([8, 6]); 

                            ctx.beginPath();
                            ctx.moveTo(x + radius, y);
                            ctx.lineTo(x + width - radius, y);
                            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                            ctx.lineTo(x + width, y + height - radius);
                            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                            ctx.lineTo(x + radius, y + height);
                            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                            ctx.lineTo(x, y + radius);
                            ctx.quadraticCurveTo(x, y, x + radius, y);
                            ctx.closePath();
                            
                            ctx.fill();
                            ctx.stroke();
                            
                            ctx.setLineDash([]); 
                        }
                        index++;
                    });
                });

                networkRef.current.on('click', function (params) {
                    if (params.nodes.length > 0) {
                        const nodeId = params.nodes[0];
                        if (nodeId.startsWith('a_')) {
                            const authorName = nodeId.substring(2);
                            onAuthorClick(authorName);
                        }
                    }
                });

                return () => {
                    if (networkRef.current) {
                        networkRef.current.destroy();
                        networkRef.current = null;
                    }
                };
            }, [data, onAuthorClick]);

            return (
                <div className="w-full h-[600px] rounded-xl overflow-hidden cursor-move border border-slate-200 shadow-inner bg-white relative">
                    <div className="absolute top-4 left-4 bg-white/95 p-3 rounded-lg border border-slate-200 shadow-sm text-xs z-10 space-y-2 pointer-events-none">
                        <div className="font-bold text-dark mb-1 border-b border-slate-100 pb-1">Leyenda Interactiva</div>
                        <div className="flex items-center">
                            <div className="w-4 h-4 bg-blue-100/60 border-2 border-dashed border-blue-300 mr-2 rounded-sm shadow-inner"></div> 
                            Áreas Temáticas
                        </div>
                        <div className="flex items-center"><div className="w-4 h-4 bg-white border border-slate-400 mr-2 shadow-sm"></div> Materias</div>
                        <div className="flex items-center"><div className="w-4 h-4 bg-primaryLight border border-primary mr-2 shadow-sm"></div> Cátedras</div>
                        <div className="flex items-center"><div className="w-4 h-4 rounded-full bg-emerald-500 border border-emerald-700 mr-2"></div> Autores Conectores</div>
                        <div className="text-slate-500 italic mt-2">Haz clic en un autor para ver sus citas.</div>
                    </div>
                    <div ref={containerRef} className="w-full h-full">
                        {data.length === 0 && (
                            <div className="w-full h-full flex items-center justify-center text-slate-400">
                                Ninguna cátedra visible en el mapa.
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        function App() {
            const [rawData, setRawData] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [error, setError] = useState(null);
            
            const [selectedAuthor, setSelectedAuthor] = useState(null);
            const [selectedEvolutionYear, setSelectedEvolutionYear] = useState(null);
            
            // Estados para el mapa epistemológico
            const [mapHiddenCatedras, setMapHiddenCatedras] = useState(new Set()); 
            const [mapSelectedYear, setMapSelectedYear] = useState('Todos');
            const [showMapConfig, setShowMapConfig] = useState(false); 
            
            // Selector múltiple de cátedras para evolución
            const [evolutionSelectedCatedras, setEvolutionSelectedCatedras] = useState(new Set());
            const [showEvolutionFilter, setShowEvolutionFilter] = useState(false);

            // Cotización de Autores (Gráfico de líneas)
            const [authorSearchQuery, setAuthorSearchQuery] = useState('');
            const [selectedEvolutionAuthors, setSelectedEvolutionAuthors] = useState([]);
            const [showAuthorDropdown, setShowAuthorDropdown] = useState(false);
            const searchInputRef = useRef(null);

            const fetchSheetData = useCallback(async () => {
                setIsLoading(true);
                setError(null);
                try {
                    // ID de la hoja de cálculo de Google provista
                    const sheetId = '1ARaGDBVnQaE2HijdVwLE6xe00fuaOJsZ';
                    // Utilizamos la exportación directa a formato CSV que ofrece Google Sheets para documentos públicos
                    const url = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv`;
                    
                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error('No se pudo establecer conexión con el documento de Google Sheets.');
                    }
                    
                    const csvText = await response.text();
                    const data = parseCSV(csvText);
                    setRawData(data);
                    
                    // Reiniciar estados visuales ante nueva carga de datos
                    setMapHiddenCatedras(new Set());
                    setMapSelectedYear('Todos');
                    setSelectedEvolutionAuthors([]);
                } catch (err) {
                    setError('Ocurrió un problema al descargar los datos: ' + err.message);
                } finally {
                    setIsLoading(false);
                }
            }, []);

            // Disparar la primera carga de datos al iniciar la aplicación
            useEffect(() => {
                fetchSheetData();
            }, [fetchSheetData]);

            useEffect(() => {
                if (selectedAuthor) {
                    document.body.classList.add('modal-open');
                } else {
                    document.body.classList.remove('modal-open');
                }
            }, [selectedAuthor]);

            // Conjunto de datos base válidos (para métricas y mapa globales)
            const validData = useMemo(() => {
                return rawData.filter(row => Boolean(getAuthorName(row)));
            }, [rawData]);

            // Listado único de cátedras para los filtros de la aplicación
            const allCatedrasForMap = useMemo(() => {
                const cats = new Set();
                validData.forEach(row => {
                    if (row['Catedra']) cats.add(row['Catedra']);
                });
                return Array.from(cats).sort();
            }, [validData]);

            // Años únicos disponibles para el filtro del mapa
            const availableMapYears = useMemo(() => {
                const years = new Set();
                validData.forEach(row => {
                    const y = parseInt(row['Año del programa']);
                    if (!isNaN(y)) years.add(y);
                });
                return Array.from(years).sort((a,b) => a - b).map(String);
            }, [validData]);

            // Inicializar las cátedras seleccionadas para la evolución cuando cambian los datos
            useEffect(() => {
                setEvolutionSelectedCatedras(new Set(allCatedrasForMap));
            }, [allCatedrasForMap]);

            // Cierre del dropdown de búsqueda al hacer clic afuera
            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (searchInputRef.current && !searchInputRef.current.contains(event.target)) {
                        setShowAuthorDropdown(false);
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            const toggleMapCatedra = (catName) => {
                setMapHiddenCatedras(prev => {
                    const next = new Set(prev);
                    if (next.has(catName)) next.delete(catName);
                    else next.add(catName);
                    return next;
                });
            };

            // Filtrar data del mapa basado en cátedras ocultas y el año seleccionado (lógica de vigencia)
            const dataForMap = useMemo(() => {
                let filtered = validData.filter(row => !mapHiddenCatedras.has(row['Catedra']));

                if (mapSelectedYear !== 'Todos') {
                    const yearNum = parseInt(mapSelectedYear);
                    const latestYearPerCatedra = {};
                    
                    // Identificar el programa más reciente (<= año seleccionado) para cada cátedra
                    filtered.forEach(row => {
                        const c = row['Catedra'];
                        const y = parseInt(row['Año del programa']);
                        if (c && !isNaN(y) && y <= yearNum) {
                            if (!latestYearPerCatedra[c] || y > latestYearPerCatedra[c]) {
                                latestYearPerCatedra[c] = y;
                            }
                        }
                    });
                    
                    // Filtrar los registros para mantener solo los que correspondan al programa vigente
                    filtered = filtered.filter(row => {
                        const c = row['Catedra'];
                        const y = parseInt(row['Año del programa']);
                        return c && latestYearPerCatedra[c] === y;
                    });
                }

                return filtered;
            }, [validData, mapHiddenCatedras, mapSelectedYear]);

            // Conjunto de datos filtrados ESPECÍFICAMENTE para la vista temporal con selector múltiple
            const filteredForTemporal = useMemo(() => {
                return validData.filter(row => evolutionSelectedCatedras.has(row['Catedra']));
            }, [validData, evolutionSelectedCatedras]);

            // Lista de autores únicos disponibles en el contexto temporal filtrado (para la barra de búsqueda)
            const availableAuthorsForSearch = useMemo(() => {
                const authors = new Set();
                filteredForTemporal.forEach(row => {
                    const a = getAuthorName(row);
                    if (a) authors.add(a);
                });
                return Array.from(authors).sort();
            }, [filteredForTemporal]);

            // Autores filtrados en vivo mientras se tipea
            const filteredSearchAuthors = useMemo(() => {
                if (!authorSearchQuery) return [];
                const lowerQuery = authorSearchQuery.toLowerCase();
                return availableAuthorsForSearch
                    .filter(a => a.toLowerCase().includes(lowerQuery) && !selectedEvolutionAuthors.includes(a))
                    .slice(0, 8); // Limitamos resultados visuales a 8
            }, [authorSearchQuery, availableAuthorsForSearch, selectedEvolutionAuthors]);

            // Manejo de la selección de autores para la cotización
            const toggleEvolutionAuthor = (author) => {
                setSelectedEvolutionAuthors(prev => {
                    if (prev.includes(author)) return prev.filter(a => a !== author);
                    if (prev.length >= 6) return prev; // Limitamos a 6 líneas máximo para no saturar
                    return [...prev, author];
                });
                setAuthorSearchQuery('');
                setShowAuthorDropdown(false);
            };

            // Lógica de arrastre temporal (Carry-over) para programas vigentes usando el data filtrada
            const temporalAnalysis = useMemo(() => {
                if (filteredForTemporal.length === 0) return { evolution: [], yearlyAuthors: {}, yearlyEditorials: {}, yearlyMaxEditorials: {}, yearlyActiveAuthorsMap: {}, maxTexts: 1, latestYear: null };

                const programSnapshots = {}; 
                let minYear = Infinity;
                let maxYear = -Infinity;

                filteredForTemporal.forEach(row => {
                    const m = row['Materia'] || 'Sin Materia';
                    const c = row['Catedra'] || 'Sin Cátedra';
                    const a = getAuthorName(row);
                    const ed = (row['Editorial'] || '').trim();
                    const yearStr = row['Año del programa'];
                    const year = parseInt(yearStr, 10);

                    if (!a || isNaN(year)) return;

                    if (year < minYear) minYear = year;
                    if (year > maxYear) maxYear = year;

                    const key = `${m}::${c}`;
                    if (!programSnapshots[key]) programSnapshots[key] = {};
                    if (!programSnapshots[key][year]) programSnapshots[key][year] = [];
                    programSnapshots[key][year].push({ author: a, editorial: ed });
                });

                if (minYear === Infinity) return { evolution: [], yearlyAuthors: {}, yearlyEditorials: {}, yearlyMaxEditorials: {}, yearlyActiveAuthorsMap: {}, maxTexts: 1, latestYear: null };

                const evolution = [];
                const yearlyAuthors = {};
                const yearlyEditorials = {};
                const yearlyMaxEditorials = {};
                const yearlyActiveAuthorsMap = {}; // Mapa para alimentar el gráfico de cotización
                let maxTexts = 1;

                for (let y = minYear; y <= maxYear; y++) {
                    let activeAuthorsForYear = {};
                    let activeEditorialsForYear = {};
                    let totalActiveTexts = 0;

                    Object.keys(programSnapshots).forEach(key => {
                        const years = Object.keys(programSnapshots[key]).map(Number).sort((a,b) => a - b);
                        let activeYear = null;
                        for(let i = years.length - 1; i >= 0; i--) {
                            if (years[i] <= y) {
                                activeYear = years[i];
                                break;
                            }
                        }

                        if (activeYear !== null) {
                            const itemsInProgram = programSnapshots[key][activeYear];
                            itemsInProgram.forEach(item => {
                                activeAuthorsForYear[item.author] = (activeAuthorsForYear[item.author] || 0) + 1;
                                
                                if (item.editorial && item.editorial !== '-' && item.editorial.toLowerCase() !== 's/d') {
                                    const edKey = item.editorial.toUpperCase();
                                    if (!activeEditorialsForYear[edKey]) {
                                        activeEditorialsForYear[edKey] = { name: item.editorial, count: 0 };
                                    }
                                    activeEditorialsForYear[edKey].count++;
                                }
                                
                                totalActiveTexts++;
                            });
                        }
                    });

                    if (totalActiveTexts > 0) {
                        const uniqueAuthorsCount = Object.keys(activeAuthorsForYear).length;
                        if (totalActiveTexts > maxTexts) maxTexts = totalActiveTexts;

                        const yearStr = y.toString();
                        evolution.push({
                            year: yearStr,
                            texts: totalActiveTexts,
                            authors: uniqueAuthorsCount
                        });
                        
                        yearlyAuthors[yearStr] = Object.entries(activeAuthorsForYear)
                            .map(([name, count]) => ({ name, count }))
                            .sort((a, b) => b.count - a.count);
                            
                        const topEditorials = Object.values(activeEditorialsForYear)
                            .sort((a, b) => b.count - a.count)
                            .slice(0, 10); // Mantener top 10 para editoriales
                            
                        yearlyEditorials[yearStr] = topEditorials;
                        yearlyMaxEditorials[yearStr] = topEditorials.length > 0 ? topEditorials[0].count : 1;
                        yearlyActiveAuthorsMap[yearStr] = activeAuthorsForYear;
                    }
                }

                return { evolution, yearlyAuthors, yearlyEditorials, yearlyMaxEditorials, yearlyActiveAuthorsMap, maxTexts, latestYear: maxYear.toString() };
            }, [filteredForTemporal]);

            useEffect(() => {
                if (temporalAnalysis.latestYear) {
                    setSelectedEvolutionYear(temporalAnalysis.latestYear);
                }
            }, [temporalAnalysis.latestYear]);

            // Métricas Globales
            const stats = useMemo(() => {
                const authorsCount = {};
                const genderCount = { 'Masculino': 0, 'Femenino': 0, 'Otro/No especificado': 0 };
                const authorCatedras = {};
                const materiasSet = new Set();
                const catedrasSet = new Set();

                validData.forEach(row => {
                    const author = getAuthorName(row);
                    const gender = row['Genero 1'];
                    const catedra = (row['Catedra'] || '').trim();
                    const materia = (row['Materia'] || '').trim();

                    if (materia) materiasSet.add(materia);
                    if (catedra && materia) catedrasSet.add(`${materia}::${catedra}`);
                    else if (catedra) catedrasSet.add(catedra);

                    if (!author) return;

                    authorsCount[author] = (authorsCount[author] || 0) + 1;

                    if (gender && gender.toLowerCase().includes('masculino')) {
                        genderCount['Masculino']++;
                    } else if (gender && gender.toLowerCase().includes('femenino')) {
                        genderCount['Femenino']++;
                    } else {
                        genderCount['Otro/No especificado']++;
                    }

                    if (catedra && materia) {
                        if (!authorCatedras[author]) authorCatedras[author] = new Set();
                        authorCatedras[author].add(`${materia} (${catedra})`);
                    }
                });

                const connectors = Object.entries(authorCatedras)
                    .map(([author, catSet]) => ({ author, count: catSet.size, catedras: Array.from(catSet) }))
                    .filter(a => a.count > 1)
                    .sort((a, b) => b.count - a.count)
                    .slice(0, 8);

                return {
                    totalTexts: validData.length,
                    uniqueAuthors: Object.keys(authorsCount).length,
                    uniqueMaterias: materiasSet.size,
                    uniqueCatedras: catedrasSet.size,
                    genderCount,
                    connectors
                };
            }, [validData]);

            const getAuthorCitations = (authorName) => {
                return validData
                    .filter(row => getAuthorName(row) === authorName)
                    .map(row => ({
                        cita: row['Cita'],
                        catedra: row['Catedra'],
                        materia: row['Materia'],
                        anio: row['Año del programa']
                    }));
            };

            // Pantalla de carga inicial
            if (isLoading && rawData.length === 0) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center max-w-md w-full text-center">
                            <Activity className="h-12 w-12 text-primary mb-6 animate-spin-slow" />
                            <h2 className="text-xl font-bold text-dark mb-2">Sincronizando Información</h2>
                            <p className="text-slate-500 text-sm">Descargando y procesando los datos bibliográficos directamente desde tu documento de Google Sheets. Esto tomará solo un momento.</p>
                        </div>
                    </div>
                );
            }

            // Pantalla de error de conexión
            if (error && rawData.length === 0) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 flex flex-col items-center max-w-md w-full text-center">
                            <div className="bg-red-50 p-4 rounded-full mb-6 text-red-500">
                                <AlertCircle className="h-10 w-10" />
                            </div>
                            <h2 className="text-xl font-bold text-dark mb-2">Problema de Conexión</h2>
                            <p className="text-slate-500 text-sm mb-8">{error}</p>
                            <button 
                                onClick={fetchSheetData}
                                className="bg-primary hover:bg-primaryDark text-white font-bold py-3 px-8 rounded-xl transition-all shadow-md flex items-center space-x-2"
                            >
                                <RefreshCw className="h-4 w-4" />
                                <span>Intentar nuevamente</span>
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div>
                    {selectedAuthor && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-dark/60 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-3xl max-h-[85vh] flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]">
                                <div className="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                                    <div className="flex items-center space-x-3">
                                        <div className="p-2 bg-primaryMuted text-primaryDark rounded-lg">
                                            <FileText className="h-5 w-5" />
                                        </div>
                                        <div>
                                            <h3 className="text-lg font-bold text-dark leading-tight">Citas Registradas</h3>
                                            <p className="text-sm text-slate-500 font-medium">{selectedAuthor}</p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setSelectedAuthor(null)}
                                        className="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-200 rounded-full transition-colors"
                                    >
                                        <XIcon className="h-5 w-5" />
                                    </button>
                                </div>
                                <div className="p-6 overflow-y-auto bg-white flex-1 custom-scrollbar">
                                    <div className="space-y-4">
                                        {getAuthorCitations(selectedAuthor).map((item, idx) => (
                                            <div key={idx} className="p-4 rounded-xl border border-slate-200 bg-slate-50 hover:bg-primaryLight/50 transition-colors">
                                                <p className="text-dark text-sm font-serif leading-relaxed mb-3">"{item.cita || 'Cita no disponible en el registro'}"</p>
                                                <div className="flex flex-wrap gap-2">
                                                    <span className="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-medium bg-white border border-slate-200 text-slate-600">
                                                        Materia: {item.materia || 'N/A'}
                                                    </span>
                                                    <span className="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-medium bg-primaryMuted text-primaryDark">
                                                        Cátedra: {item.catedra || 'N/A'}
                                                    </span>
                                                    <span className="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-medium bg-slate-100 text-slate-600">
                                                        Programa: {item.anio || 'N/A'}
                                                    </span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    <header className="bg-primary text-white shadow-lg sticky top-0 z-40 border-b border-primaryDark">

                                                <div className="mb-4 text-center">
                                                    <h3 className="text-sm font-bold text-dark">Composición del Programa</h3>
                                                    <span className="text-xs font-bold text-primary bg-primaryLight px-3 py-1 rounded-full mt-1 inline-block">Año {selectedEvolutionYear || '---'}</span>
                                                </div>
                                                <div className="overflow-hidden">
                                                    {selectedEvolutionYear && temporalAnalysis.yearlyAuthors[selectedEvolutionYear] ? (
                                                        <SVGCompositionPie 
                                                            data={temporalAnalysis.yearlyAuthors[selectedEvolutionYear]} 
                                                            onAuthorClick={setSelectedAuthor}
                                                        />
                                                    ) : (
                                                        <div className="py-12 flex items-center justify-center text-sm text-slate-400">Selecciona un año en el gráfico</div>
                                                    )}
                                                </div>
                                            </div>

                                            <div className="bg-slate-50 rounded-xl p-5 border border-slate-100 flex flex-col">
                                                <div className="mb-4 text-center">
                                                    <h3 className="text-sm font-bold text-dark flex items-center justify-center">
                                                        <Bookmark className="h-4 w-4 text-slate-400 mr-2" />
                                                        Editoriales Más Leídas
                                                    </h3>
                                                    <span className="text-xs font-bold text-primary bg-primaryLight px-3 py-1 rounded-full mt-1 inline-block">Año {selectedEvolutionYear || '---'}</span>
                                                </div>
                                                <div className="overflow-y-auto pr-2 custom-scrollbar space-y-3 max-h-[400px]">
                                                    {selectedEvolutionYear && temporalAnalysis.yearlyEditorials[selectedEvolutionYear] && temporalAnalysis.yearlyEditorials[selectedEvolutionYear].length > 0 ? (
                                                        temporalAnalysis.yearlyEditorials[selectedEvolutionYear].map((ed, idx) => (
                                                            <div key={idx} className="flex items-center group">
                                                                <span className="w-1/3 text-xs font-medium text-slate-700 truncate pr-2 group-hover:text-amber-600 transition-colors" title={ed.name}>
                                                                    {ed.name}
                                                                </span>
                                                                <div className="w-2/3 flex items-center">
                                                                    <div className="flex-1 h-3 bg-slate-200/50 rounded-full overflow-hidden">
                                                                        <div 
                                                                            className="h-full bg-amber-500 rounded-full transition-all duration-500 ease-out group-hover:bg-amber-400"
                                                                            style={{ width: `${(ed.count / temporalAnalysis.yearlyMaxEditorials[selectedEvolutionYear]) * 100}%` }}
                                                                        ></div>
                                                                    </div>
                                                                    <span className="ml-2 text-[11px] font-bold text-slate-500 w-8 text-right group-hover:text-amber-600">
                                                                        {ed.count}
                                                                    </span>
                                                                </div>
                                                            </div>
                                                        ))
                                                    ) : (
                                                        <div className="py-8 flex items-center justify-center text-sm text-slate-400 text-center">No hay datos de editoriales suficientes.</div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
